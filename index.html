<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAASH Early Access</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins, sans-serif;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.container{
max-width:600px;
width:100%;
text-align:center;
}

.logo{
font-size:48px;
letter-spacing:5px;
font-weight:600;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.subtitle{
opacity:.7;
margin-bottom:40px;
}

.form-box{
background:#0d0d0d;
padding:30px;
border-radius:15px;
border:1px solid #1c1c1c;
}

input, select{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:8px;
background:#121212;
color:white;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

.counter{
margin-top:25px;
color:#ff00aa;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">BAASH</div>

<h1>Get Early Access</h1>

<p class="subtitle">
Discover nightlife, events and premium experiences.
Join the BAASH early community.
</p>

<div class="form-box">

<form id="waitlistForm">

<input type="email" name="email" placeholder="Your email" required>

<select name="city" required>
<option value="">Select your city</option>
<option>Delhi</option>
<option>Mumbai</option>
<option>Bangalore</option>
<option>Dubai</option>
</select>

<select name="interest" required>
<option value="">Interest</option>
<option>Nightlife</option>
<option>VIP Events</option>
<option>Travel</option>
<option>Arcades</option>
</select>

<button type="submit">Join Early Access</button>

</form>

<div class="counter">
🔥 Join the BAASH waitlist
</div>

</div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxyLsUzmnf5pzHsRDVdeubt-DiRwXmTB1HK32RxYbiKM7EpOzOiRGbmrP-_fdCS9PK6Kw/exec";

const form = document.getElementById("waitlistForm");

form.addEventListener("submit", e => {

e.preventDefault();

fetch(scriptURL, {
method: "POST",
body: new FormData(form)
})
.then(response => {

alert("You're on the BAASH early access list!");

form.reset();

})
.catch(error => console.error("Error!", error));

});

</script>

</body>
</html>
