
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAASH X EY</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
max-width:500px;
width:100%;
text-align:center;
}

.top-logo{
display:flex;
justify-content:center;
margin-bottom:15px;
}

.top-logo img{
width:90px;
height:90px;
object-fit:contain;
}

.logo{
font-size:52px;
letter-spacing:6px;
font-weight:600;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.subtitle{
opacity:.7;
margin-bottom:35px;
line-height:1.6;
}

.form-box{
background:#0d0d0d;
padding:30px;
border-radius:18px;
border:1px solid #1c1c1c;
}

input{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:10px;
background:#121212;
color:white;
font-size:15px;
outline:none;
}

input:focus{
border:1px solid #8b3dff;
}

button{
width:100%;
margin-top:22px;
padding:15px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
color:white;
font-size:16px;
font-weight:500;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.02);
}

.note{
margin-top:20px;
font-size:14px;
opacity:.7;
color:#ff00aa;
}

</style>

</head>

<body>

<div class="container">

<!-- TOP LOGO -->
<div class="top-logo">
<img src="logo.png" alt="BAASH Logo">
</div>

<!-- TEXT LOGO -->
<div class="logo">BAASH</div>

<h1>Party Registration</h1>

<p class="subtitle">
Register now to confirm your entry for the upcoming BAASH experience.
</p>

<div class="form-box">

<form id="partyForm">

<input 
type="text" 
name="name" 
placeholder="Full Name" 
required
>

<input 
type="email" 
name="email" 
placeholder="Email Address" 
required
>

<input 
type="tel" 
name="phone" 
placeholder="Contact Number" 
required
>

<button type="submit">
Register Now
</button>

</form>

</div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxyLsUzmnf5pzHsRDVdeubt-DiRwXmTB1HK32RxYbiKM7EpOzOiRGbmrP-_fdCS9PK6Kw/exec";

const form = document.getElementById("partyForm");

form.addEventListener("submit", e => {

e.preventDefault();

fetch(scriptURL, {
method: "POST",
body: new FormData(form)
})
.then(response => {

alert("Registration Successful!");

form.reset();

})
.catch(error => {

alert("Something went wrong!");

console.error(error);

});

});

</script>

</body>

</html>
