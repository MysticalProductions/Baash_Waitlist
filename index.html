
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAASH X EY</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:hidden;
}

.container{
max-width:500px;
width:100%;
text-align:center;
position:relative;
z-index:2;
}

.top-logo{
display:flex;
justify-content:center;
margin-bottom:15px;
}

.top-logo img{
width:90px;
height:90px;
object-fit:contain;
}

.logo{
font-size:52px;
letter-spacing:6px;
font-weight:600;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.subtitle{
opacity:.7;
margin-bottom:35px;
line-height:1.6;
}

.form-box{
background:#0d0d0d;
padding:30px;
border-radius:18px;
border:1px solid #1c1c1c;
}

input{
width:100%;
padding:15px;
margin-top:14px;
border:none;
border-radius:10px;
background:#121212;
color:white;
font-size:15px;
outline:none;
}

input:focus{
border:1px solid #8b3dff;
}

button{
width:100%;
margin-top:22px;
padding:15px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
color:white;
font-size:16px;
font-weight:500;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.02);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

/* LOADER */

.loader-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.loader{
width:70px;
height:70px;
border:5px solid #222;
border-top:5px solid #ff00aa;
border-radius:50%;
animation:spin 1s linear infinite;
}

.loader-text{
margin-top:20px;
font-size:18px;
color:white;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* POPUP */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(.8);
background:#0d0d0d;
padding:35px;
border-radius:20px;
border:1px solid #2a2a2a;
text-align:center;
width:90%;
max-width:400px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:1000;
}

.popup.active{
opacity:1;
pointer-events:auto;
transform:translate(-50%,-50%) scale(1);
}

.popup-icon{
font-size:60px;
margin-bottom:15px;
}

.popup h2{
margin-bottom:10px;
}

.popup p{
opacity:.7;
line-height:1.6;
margin-bottom:25px;
}

.close-btn{
padding:12px 25px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#8b3dff,#ff00aa);
color:white;
cursor:pointer;
font-size:15px;
}

</style>

</head>

<body>

<!-- LOADER -->

<div class="loader-overlay" id="loader">

<div class="loader"></div>

<div class="loader-text">
Registering...
</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-icon" id="popupIcon">
🎉
</div>

<h2 id="popupTitle">
Registration Successful
</h2>

<p id="popupMessage">
You have successfully registered for the BAASH experience.
</p>

<button class="close-btn" onclick="closePopup()">
Done
</button>

</div>

<div class="container">

<!-- TOP LOGO -->

<div class="top-logo">
<img src="logo.png" alt="BAASH Logo">
</div>

<!-- BAASH TEXT -->

<div class="logo">BAASH</div>

<h1>Party Registration</h1>

<p class="subtitle">
Register now to confirm your entry for the upcoming BAASH experience.
</p>

<div class="form-box">

<form id="partyForm">

<input 
type="text" 
name="name" 
placeholder="Full Name" 
required
>

<input 
type="email" 
name="email" 
placeholder="Email Address" 
required
>

<input 
type="tel" 
name="phone" 
id="phone"
placeholder="Contact Number"
maxlength="10"
required
>

<button type="submit" id="submitBtn">
Register Now
</button>

</form>

</div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxSvi6dbyISlIPviTKAGnDhwLkyW-P39-5gkEgoGVBp3xmKnFaosdxICOyNwIzgJMtOwQ/exec";

const form = document.getElementById("partyForm");

const loader = document.getElementById("loader");

const popup = document.getElementById("popup");

const popupIcon = document.getElementById("popupIcon");

const popupTitle = document.getElementById("popupTitle");

const popupMessage = document.getElementById("popupMessage");

const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", e => {

e.preventDefault();

const phone = document.getElementById("phone").value.trim();

const phoneRegex = /^[6-9]\d{9}$/;

// MOBILE NUMBER VALIDATION

if(!phoneRegex.test(phone)){

popupIcon.innerHTML = "📱";

popupTitle.innerHTML = "Invalid Mobile Number";

popupMessage.innerHTML =
"Please enter a valid 10-digit mobile number.";

popup.classList.add("active");

return;

}

loader.style.display = "flex";

submitBtn.disabled = true;

fetch(scriptURL, {
method: "POST",
body: new FormData(form)
})
.then(response => response.json())
.then(data => {

loader.style.display = "none";

submitBtn.disabled = false;

if(data.status === "success"){

popupIcon.innerHTML = "🎉";

popupTitle.innerHTML = "Registration Successful";

popupMessage.innerHTML =
"You have successfully registered for the BAASH experience.";

popup.classList.add("active");

form.reset();

}else{

popupIcon.innerHTML = "❌";

popupTitle.innerHTML = "Registration Failed";

popupMessage.innerHTML =
"Something went wrong while submitting your registration.";

popup.classList.add("active");

}

})
.catch(error => {

loader.style.display = "none";

submitBtn.disabled = false;

console.error(error);

popupIcon.innerHTML = "⚠️";

popupTitle.innerHTML = "Server Error";

popupMessage.innerHTML =
"Unable to connect to server. Please try again.";

popup.classList.add("active");

});

});

function closePopup(){

popup.classList.remove("active");

}

</script>

</body>

</html>
